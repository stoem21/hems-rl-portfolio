name: Validate source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hems-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hems-frontend/package-lock.json
      - run: npm ci
      - run: node --test src/lib/simulationStream.test.js src/data/dashboardData.test.js
      - run: node --test ../ops/tests/dashboard-data.test.cjs
      - run: npm run build
